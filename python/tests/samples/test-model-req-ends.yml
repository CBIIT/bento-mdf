Handle: test_req_ends
Nodes:
  study:
    Props:
      - study_name
  case:
    Props:
      - case_id
  sample:
    Props:
      - sample_type
  diagnosis:
    Props:
      - disease
  file:
    Props:
      - file_name
  generic_file:
    Props:
      - file_name
      
Relationships:
  of_case:
    Props: ~
    Mul: many_to_one
    Ends:
      - Src: sample
        Dst: case
        Req: true
      - Src: diagnosis
        Dst: case
        Req: false
  of_sample:
    Props: ~
    Mul: many_to_one
    Req: true
    Ends:
      - Src: file
        Dst: sample
      - Src: diagnosis
        Dst: sample
  of_self:
    Props: ~
    Ends:
      - Src: file
        Dst: file
      - Src: sample
        Dst: sample

  from_case:
    Ends:
      - Src: case
        Dst: diagnosis
        Req: true
      - Src: case
        Dst: sample

  of_generic_file_1: #should warn
    Props: null
    #Mul: many_to_one <-- commented out
    Ends:
      - Src: generic_file
        Dst: study
        # Mul: many_to_one <-- commented out
      - Src: generic_file
        Dst: case
        Mul: many_to_one
      - Src: generic_file
        Dst: sample
        Mul: one_to_many

  of_generic_file_2: # shouldn't warn
    Props: null
    #Mul: many_to_one <-- commented out
    Ends:
      - Src: generic_file
        Dst: study
        Mul: many_to_one
      - Src: generic_file
        Dst: case
        Mul: many_to_one
      - Src: generic_file
        Dst: sample
        Mul: one_to_many
          
  of_generic_file_3: # shouldn't warn
    Props: null
    Mul: many_to_one
    Ends:
      - Src: generic_file
        Dst: study
        Mul: many_to_one 
      - Src: generic_file
        Dst: case
        Mul: many_to_one
      - Src: generic_file
        Dst: sample
        Mul: one_to_many
  of_generic_file_4: # should warn for all three edges
    Props: null
    Ends:
      - Src: generic_file
        Dst: study
      - Src: generic_file
        Dst: case
      - Src: generic_file
        Dst: sample        

PropDefinitions:
  case_id:
    Type: string
  sample_type:
    Type: string
  disease:
    Type: string
  file_name:
    Type: string
  study_name:
    Type: string
    
